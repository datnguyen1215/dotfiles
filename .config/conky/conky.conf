conky.config = {
    alignment = 'top_right',
    background = false,
    own_window_transparent = true,  -- Enables transparency
    own_window_argb_visual = true,  -- Needed for true transparency
    own_window_argb_value = 0,  -- Maximum transparency
    border_width = 0,
    cpu_avg_samples = 2,
    default_color = 'white',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = false,
    draw_outline = false,
    draw_shades = false,
    use_xft = true,
    font = 'DejaVu Sans Mono:size=10',
    gap_x = 10,
    gap_y = 50,
    minimum_height = 5,
    minimum_width = 5,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_ncurses = false,
    out_to_stderr = false,
    extra_newline = false,
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'dock',  -- 'normal' might be more compatible here
    own_window_hints = 'below,sticky,skip_taskbar,skip_pager',
    own_window_transparent = true,
    update_interval = 5.0,
    use_spacer = 'none',
    show_graph_scale = false,
    show_graph_range = false,
};

conky.text = [[
${color lightblue}Time:${color white} $time
${color lightblue}Uptime:${color white} $uptime

${color lightblue}CPU Usage:${color white} $cpu%
${cpubar 4,190}

${color lightblue}RAM Usage:${color white} $mem/$memmax
${membar 4,190}

${color lightblue}Disk Usage:${color white} ${fs_used /}/${fs_size /}

${color lightblue}Network:
${color lightblue}Down:${color white} ${downspeedf eno1} kB/s
${color lightblue}Up:${color white} ${upspeedf eno1} kB/s

${color lightblue}Top CPU Processes:
${color white}${top name 1} ${top cpu 1}%
${color white}${top name 2} ${top cpu 2}%
${color white}${top name 3} ${top cpu 3}%

${color lightblue}Top RAM Processes:
${color white}${top_mem name 1} ${top_mem mem 1}%
${color white}${top_mem name 2} ${top_mem mem 2}%
${color white}${top_mem name 3} ${top_mem mem 3}%
]];
